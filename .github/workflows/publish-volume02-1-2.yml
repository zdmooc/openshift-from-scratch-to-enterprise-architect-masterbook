name: Publish OpenShift Masterbook Volume 02 Edition 1.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-volume02-1-2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out edition source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reproducible PDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libcairo2 shared-mime-info
          python -m pip install --disable-pip-version-check "mistune==3.2.0" "weasyprint==68.0" "pypdf==6.3.0"
      - name: Validate offline tests, authored docs and references
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          python scripts/check_local_links.py
          python -m examples.v02.quorum_model examples/v02/cases/etcd-three-zones.json
          python -m examples.v02.scheduling_filter examples/v02/cases/fit-and-taint.json
          python -m examples.v02.crd_versioning examples/v02/crd-versioning/review.json
      - name: Typeset full documentary edition
        run: python scripts/build_volume02_pdf.py
      - name: Check sections, PDF integrity, provenance and links
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import sys
          from pypdf import PdfReader
          sys.path.insert(0, str(Path("scripts").resolve()))
          import build_volume02_pdf as book

          path = Path("dist/OpenShift_Masterbook_Volume_02_Edition_1_2_Zidane_Djamal_2026.pdf")
          reader = PdfReader(path, strict=True)
          text = "\n".join(page.extract_text() or "" for page in reader.pages)
          assert len(book.CHAPTERS) == 12
          assert len(book.LABS) == 6
          assert len(book.CASES) == 1
          for entry in (*book.CHAPTERS, *book.LABS, *book.CASES, book.GLOSSARY,
                        book.READER_NOTICE, book.ERRATUM):
              title = book.chapter_title(entry)
              assert title in text, f"Missing authored section: {title}"
          for term in (
              "Machine API", "OLM v1", "ClusterExtension", "ConversionReview",
              "MachineConfigPool", "quorum", "Technology Preview",
              "Tous droits réservés", "Erratum"
          ):
              assert term in text, f"Missing technical topic or caveat: {term}"
          assert all(page.mediabox.width > 0 and page.mediabox.height > 0
                     for page in reader.pages)
          assert len(text) > 150000, "Body extraction unexpectedly incomplete"
          # Source links on published PDF must point to immutable release source commit.
          sha = os.environ["GITHUB_SHA"]
          internal = 0
          for page in reader.pages:
              for ref in page.get("/Annots", []):
                  item = ref.get_object()
                  action = item.get("/A")
                  if not action or "/URI" not in action:
                      continue
                  uri = str(action["/URI"])
                  if uri.startswith("file:"):
                      raise AssertionError(f"Nonportable local source link {uri}")
                  if "github.com/zdmooc/openshift-from-scratch-to-enterprise-architect-masterbook/blob/" in uri:
                      assert f"/blob/{sha}/" in uri, "Source link not pinned to commit"
                      internal += 1
          print("PINNED_SOURCE_LINKS", internal)
          assert internal >= 1, "Expected at least one immutable source link"
          print("PDF_PAGES_INFO_ONLY", len(reader.pages))
          print("PDF_EXTRACTED_CHARS", len(text))
          print("PDF_BYTES", path.stat().st_size)
          print("PDF_SHA256", hashlib.sha256(path.read_bytes()).hexdigest())
          print("PINNED_SOURCE_LINKS", internal)
          print("V02_1_2_CONTENT_QA_PASS")
          PY
      - name: Upload independently inspectable PDF
        uses: actions/upload-artifact@v4
        with:
          name: volume02-1-2-reviewed-pdf
          path: dist/OpenShift_Masterbook_Volume_02_Edition_1_2_Zidane_Djamal_2026.pdf
          retention-days: 90
          if-no-files-found: error
      - name: Publish new immutable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v02.2-20261012"
          FILE="dist/OpenShift_Masterbook_Volume_02_Edition_1_2_Zidane_Djamal_2026.pdf"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release tag already exists; refusing to overwrite" >&2
            exit 1
          fi
          gh release create "$TAG" "$FILE" \
            --title "OpenShift Masterbook — Volume 02 — Edition 1.2" \
            --notes-file docs/V02_1_2_RELEASE_NOTES.md \
            --target "$GITHUB_SHA"
